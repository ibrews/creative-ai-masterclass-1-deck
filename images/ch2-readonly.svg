<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Space Grotesk,Inter,system-ui,sans-serif"><rect width="800" height="600" rx="24" fill="#0b0f1e"/><rect x="60" y="60" width="680" height="100" rx="16" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-width="2.5"/><text x="400.0" y="110.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">1 · Look</text><text x="400.0" y="138.0" text-anchor="middle" font-size="18" fill="#9aa4c7">status, scene info, search — changes nothing</text><rect x="60" y="190" width="680" height="100" rx="16" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="2.5"/><text x="400.0" y="240.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">2 · Try one small change</text><text x="400.0" y="268.0" text-anchor="middle" font-size="18" fill="#9aa4c7">one object, one setting, one undo</text><rect x="60" y="320" width="680" height="100" rx="16" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="2.5"/><text x="400.0" y="370.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">3 · Verify, then widen</text><text x="400.0" y="398.0" text-anchor="middle" font-size="18" fill="#9aa4c7">inspect it yourself before the next step</text><text x="400" y="560" text-anchor="middle" font-size="18" fill="#9aa4c7">The required practice project needs no Unreal and no headset</text></svg>