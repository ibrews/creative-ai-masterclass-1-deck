<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia,serif"><rect width="800" height="600" rx="0" fill="#efe6d2"/><rect x="60" y="60" width="680" height="100" rx="2" fill="#342b21" fill-opacity=".12" stroke="#342b21" stroke-width="2.5"/><text x="400.0" y="110.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">1 · Look</text><text x="400.0" y="138.0" text-anchor="middle" font-size="18" fill="#463f36">status, scene info, search — changes nothing</text><rect x="60" y="190" width="680" height="100" rx="2" fill="#a3271f" fill-opacity=".12" stroke="#a3271f" stroke-width="2.5"/><text x="400.0" y="240.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">2 · Try one small change</text><text x="400.0" y="268.0" text-anchor="middle" font-size="18" fill="#463f36">one object, one setting, one undo</text><rect x="60" y="320" width="680" height="100" rx="2" fill="#84532b" fill-opacity=".12" stroke="#84532b" stroke-width="2.5"/><text x="400.0" y="370.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">3 · Verify, then widen</text><text x="400.0" y="398.0" text-anchor="middle" font-size="18" fill="#463f36">inspect it yourself before the next step</text><text x="400" y="560" text-anchor="middle" font-size="18" fill="#463f36">The required practice project needs no Unreal and no headset</text></svg>