<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia,serif"><rect width="800" height="600" rx="0" fill="#efe6d2"/><rect x="60" y="90" width="300" height="110" rx="2" fill="#a3271f" fill-opacity=".12" stroke="#a3271f" stroke-width="2.5"/><text x="210.0" y="145.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">Knowledge</text><text x="210.0" y="173.0" text-anchor="middle" font-size="18" fill="#463f36">a recipe explains a command</text><rect x="440" y="90" width="300" height="110" rx="2" fill="#84532b" fill-opacity=".12" stroke="#84532b" stroke-width="2.5"/><text x="590.0" y="145.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">Authority</text><text x="590.0" y="173.0" text-anchor="middle" font-size="18" fill="#463f36">you decide to run, spend, publish</text><line x1="400" y1="70" x2="400" y2="230" stroke="#463f36" stroke-width="3" stroke-dasharray="8 8"/><rect x="60" y="340" width="680" height="150" rx="2" fill="#342b21" fill-opacity=".12" stroke="#342b21" stroke-width="2.5"/><text x="400.0" y="415.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1714">Smallest useful access first</text><text x="400.0" y="443.0" text-anchor="middle" font-size="18" fill="#463f36">one folder · one task · a budget · a stop gate</text><text x="400" y="560" text-anchor="middle" font-size="18" fill="#463f36">Reading a recipe never grants permission to act</text></svg>