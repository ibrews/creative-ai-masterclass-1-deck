<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Space Grotesk,Inter,system-ui,sans-serif"><rect width="800" height="600" rx="24" fill="#0b0f1e"/><rect x="60" y="90" width="300" height="110" rx="16" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="2.5"/><text x="210.0" y="145.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">Knowledge</text><text x="210.0" y="173.0" text-anchor="middle" font-size="18" fill="#9aa4c7">a recipe explains a command</text><rect x="440" y="90" width="300" height="110" rx="16" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="2.5"/><text x="590.0" y="145.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">Authority</text><text x="590.0" y="173.0" text-anchor="middle" font-size="18" fill="#9aa4c7">you decide to run, spend, publish</text><line x1="400" y1="70" x2="400" y2="230" stroke="#9aa4c7" stroke-width="3" stroke-dasharray="8 8"/><rect x="60" y="340" width="680" height="150" rx="16" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-width="2.5"/><text x="400.0" y="415.0" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f4ff">Smallest useful access first</text><text x="400.0" y="443.0" text-anchor="middle" font-size="18" fill="#9aa4c7">one folder · one task · a budget · a stop gate</text><text x="400" y="560" text-anchor="middle" font-size="18" fill="#9aa4c7">Reading a recipe never grants permission to act</text></svg>